<!DOCTYPE html>
<html lang="fi">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Kiitos – Amanda & Joel</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,300;0,400;1,300;1,400&family=Jost:wght@300;400&display=swap" rel="stylesheet" />
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }

    html, body { height: 100%; }

    body {
      background: #2d4a31;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 3rem 1.5rem;
      text-align: center;
      font-family: 'Jost', sans-serif;
      font-weight: 300;
    }

    .rings {
      width: 120px;
      height: auto;
      margin-bottom: 2rem;
      animation: fadeDown 1s ease both;
    }

    h1 {
      font-family: 'Cormorant Garamond', serif;
      font-size: clamp(56px, 14vw, 88px);
      font-weight: 300;
      font-style: italic;
      color: #f0ebe0;
      line-height: 1.1;
      margin-bottom: 1.5rem;
      animation: fadeDown 1s ease .3s both;
    }

    .msg {
      font-family: 'Cormorant Garamond', serif;
      font-size: 20px;
      font-style: italic;
      color: #f0ebe0;
      line-height: 1.8;
      max-width: 420px;
      margin: 0 auto;
      animation: fadeDown 1s ease .45s both;
    }

    .sig {
      font-family: 'Cormorant Garamond', serif;
      font-style: italic;
      color: #c9a84c;
      font-size: 18px;
      margin-top: 2rem;
      animation: fadeDown 1s ease .6s both;
    }

    .date {
      font-size: 11px;
      letter-spacing: 4px;
      color: #72906e;
      margin-top: .5rem;
      animation: fadeDown 1s ease .7s both;
    }

    @keyframes fadeDown {
      from { opacity: 0; transform: translateY(-12px); }
      to   { opacity: 1; transform: translateY(0); }
    }
  </style>
</head>
<body>

  <svg class="rings" viewBox="0 0 90 64" role="img" aria-label="Vihkisormus ja kihlasormus">
    <circle cx="27" cy="40" r="18" fill="none" stroke="#c9a84c" stroke-width="3"/>
    <g transform="translate(53,40) rotate(25)">
      <circle cx="0" cy="0" r="18" fill="none" stroke="#c9a84c" stroke-width="3"/>
      <polygon points="-4.8,-23.4 4.8,-23.4 2.6,-20.2 -2.6,-20.2" fill="#cfe4f2"/>
      <polygon points="-3,-20.6 3,-20.6 2.2,-18 -2.2,-18" fill="#c9a84c"/>
      <polygon points="-2.9,-28 2.9,-28 4.8,-23.4 -4.8,-23.4" fill="#eef7fd"/>
      <polygon points="-2.9,-28 0,-23.4 -4.8,-23.4" fill="#ffffff" opacity=".85"/>
      <polygon points="2.9,-28 4.8,-23.4 0,-23.4" fill="#b9d6ea" opacity=".7"/>
      <line x1="-4.9" y1="-23.4" x2="4.9" y2="-23.4" stroke="#a8862f" stroke-width="0.6"/>
    </g>
  </svg>

  <h1>Kiitos</h1>

  <p class="msg">Kiitos, että olitte jakamassa elämämme tärkeintä päivää meidän kanssa.</p>

  <p class="sig">Amanda & Joel</p>
  <p class="date">17.10.2026</p>

</body>
</html>
